name: Release Please

# Keeps a "release" pull request open that holds the next version and changelog, built from the conventional commit
# titles on main. Merging it tags the commit and publishes the GitHub release. It does not deploy: Terraform in ci.yml
# deploys every merge to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / release
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      # A pull request opened with the built-in GITHUB_TOKEN does not start CI, so it could never pass the required
      # ci-ok check. The token is a fine-grained personal access token instead, kept in a repository secret.
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release Please skipped::RELEASE_PLEASE_TOKEN is not set. See docs/ci-and-github.md (Releases)."
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
