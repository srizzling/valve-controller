name: Release Please

# Keeps a "release" pull request open that holds the next version and changelog, built from the conventional commit
# titles on main. Merging it tags the commit and publishes the GitHub release. It does not deploy: Terraform in ci.yml
# deploys every merge to main.
#
# It uses the built-in GITHUB_TOKEN, so the release pull request does not start CI and cannot pass the required ci-ok
# check. An admin merges it with the branch protection bypass. See docs/ci-and-github.md (Releases).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
